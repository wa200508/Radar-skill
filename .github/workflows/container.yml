name: Test and publish Radar RF Skill
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: radar-skill-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build standalone receiver
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: radar-skill:test
          build-args: SOURCE_REVISION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Prove independence and unchanged I/Q replay offline
        run: docker run --rm --network none --entrypoint python radar-skill:test scripts/qualify_independence.py
      - name: Unit tests in the installed environment
        run: |
          docker run --rm --entrypoint sh radar-skill:test -c 'python -m pip install --user pytest && python -m pytest -q -p no:cacheprovider'
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish tested independent image
        if: github.event_name != 'pull_request'
        run: |
          image=ghcr.io/wa200508/radar-skill
          docker tag radar-skill:test "$image:sha-${{ github.sha }}"
          docker push "$image:sha-${{ github.sha }}"
          docker tag radar-skill:test "$image:latest"
          docker push "$image:latest"
      - name: Verify anonymous public pull
        if: github.event_name != 'pull_request'
        run: |
          anonymous_config=$(mktemp -d)
          trap 'rm -rf "$anonymous_config"' EXIT
          docker --config "$anonymous_config" pull ghcr.io/wa200508/radar-skill:sha-${{ github.sha }}
