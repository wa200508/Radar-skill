name: Test Radar RF Skill
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: radar-skill-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build standalone receiver
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: radar-skill:test
          build-args: SOURCE_REVISION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Prove independence and unchanged I/Q replay offline
        run: docker run --rm --network none --entrypoint python radar-skill:test scripts/qualify_independence.py
      - name: Unit tests in the installed environment
        run: |
          docker run --rm --entrypoint sh radar-skill:test -c 'python -m pip install --user pytest && python -m pytest -q -p no:cacheprovider'
      # Public releases are built from this repository's pinned Git commit by
      # airsim-rf/.github/workflows/radar-skill.yml. Its existing GHCR package
      # permits anonymous pulls; the separate radar-skill package currently does not.
      - name: Verify the pinned public release with a fresh anonymous pull
        env:
          PUBLIC_IMAGE: ghcr.io/wa200508/airsim-rf:radar-skill-sha-bea025f28894b089d2d371479d1a8936f1dd0fb7
        run: |
          anonymous_config=$(mktemp -d)
          trap 'rm -rf "$anonymous_config"' EXIT
          docker --config "$anonymous_config" pull "$PUBLIC_IMAGE"
          docker run --rm --network none --entrypoint python "$PUBLIC_IMAGE" scripts/qualify_independence.py
