[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "radar-skill"
version = "0.1.0"
description = "Independent FMCW radar RF skill for complex ADC receiver streams"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE", "licenses/*.txt"]
dependencies = ["numpy>=1.26"]

[project.scripts]
radar-skill = "radar_skill.app:main"

[project.optional-dependencies]
test = ["pytest>=8.3"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
